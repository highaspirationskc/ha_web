name: Deploy to Dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# Serialize dev deploys so rapid merges don't race Kamal.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.6
        bundler-cache: true

    - name: Install dependencies
      run: bundle install

    - name: Run tests 🧪
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      run: |
        bin/rails db:create db:migrate
        bin/rails test

  deploy:
    needs: test
    # Gate until the QA VPS and secrets are ready. Flip via repo variable:
    # Settings → Secrets and variables → Actions → Variables → DEV_DEPLOY_ENABLED=true
    if: ${{ vars.DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.6
        bundler-cache: true

    - name: Setup SSH 🔑
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.HA_DEPLOY_KEY }}

    - name: Create .kamal/secrets File 📁💥
      run: |
        mkdir -p .kamal
        cat > .kamal/secrets <<EOF
        KAMAL_REGISTRY_PASSWORD=${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
        EOF

    - name: Deploy with Kamal (dev destination) 🚀
      run: bundle exec kamal deploy -d dev
